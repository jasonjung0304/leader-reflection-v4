<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>기억에 남는 키워드</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#000000}a:hover{color:#444444}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #ffffff; color: #000000; font-family: 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
<header style="height: 56px; padding: 0 20px 0 4px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0">
<a href="Review4.dc.html" aria-label="이전 화면" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></a>
<span style="font-size: 14px; font-weight: 700">STEP 1 · Great Candor Review</span>
<span style="font-size: 12px; color: #676767">6/6</span>
</header>
<div role="progressbar" aria-label="진행" aria-valuemin="0" aria-valuemax="6" aria-valuenow="6" style="height: 4px; background: #e6e6e6; flex-shrink: 0"><div style="width: 100%; height: 4px; background: #000000"></div></div>
<main style="flex: 1; padding: 24px 20px 20px; display: flex; flex-direction: column; gap: 24px; overflow: hidden">
<div style="display: flex; flex-direction: column; align-items: center; gap: 10px; padding-bottom: 20px; border-bottom: 1px solid #e6e6e6; text-align: center">
<p style="margin: 0; font-size: 13px; font-weight: 700; color: #676767">마지막으로</p>
<h1 id="kw-title" style="margin: 0; font-size: 26px; line-height: 1.35; font-weight: 700; letter-spacing: -0.025em; word-break: keep-all">Great Candor 중 기억에<br>남는 것을 골라 주세요</h1>
<p style="margin: 0; font-size: 15px; line-height: 1.6; color: #444444; word-break: keep-all">1개 이상, 최대 3개까지 고를 수 있어요.</p>
</div>
<section aria-labelledby="kw-title" style="display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: center; justify-content: space-between">
<h2 style="margin: 0; font-size: 13px; font-weight: 700; color: #676767">키워드</h2>
<p aria-live="polite" style="margin: 0; font-size: 13px; font-weight: 700; color: #000000">{{ count }}/3 선택</p>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{ keywords }}" as="item" hint-placeholder-count="10">
<button type="button" onClick="{{ item.pick }}" aria-pressed="{{ item.pressed }}" aria-disabled="{{ item.disabled }}" style="{{ item.style }}">{{ item.label }}</button>
</sc-for>
</div>
</section>
</main>
<div style="padding: 12px 20px 20px; border-top: 1px solid #e6e6e6; display: flex; flex-direction: column; gap: 4px; flex-shrink: 0">
<sc-if value="{{ canNext }}" hint-placeholder-val="{{ true }}">
<a href="Main.dc.html" style="height: 48px; border-radius: 24px; background: #00B09B; color: #ffffff; text-decoration: none; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700">면담 스타일 점검하기</a>
</sc-if>
<sc-if value="{{ cannotNext }}" hint-placeholder-val="{{ false }}">
<span aria-disabled="true" style="height: 48px; border-radius: 24px; background: #e6e6e6; color: #8f8f8f; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700">면담 스타일 점검하기</span>
<p style="margin: 4px 0 0; text-align: center; font-size: 12px; color: #676767">1개 이상 골라 주세요.</p>
</sc-if>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
// [결정 2026-11-25 · 다음 버튼 색] 하단 주 버튼('다음', '결과 보기', '꼭 해야 하는 말 정하기', '완료' 등)은 단색 #00B09B + 흰 굵은 글씨(그라데이션 없음). 막힌 상태는 회색(#e6e6e6 배경, #8f8f8f 글자)으로 구분. 진행 막대·선택된 답 칩은 검정 유지
const NONE = '잘 떠오르지 않아요';
// 체크 문항과 연결되는 키워드만 둔다(연결표는 Result3 주석). 직접 추가(+)는 비교할 문항이 없어 삭제
const labels = ['면담 오프닝', '끝까지 경청', '확대 질문', '미래 질문', '지지적 피드백 AIT', '발전적 피드백 AID', '피드포워드', '공정성 3요소', '평가 오류 점검', NONE];
const st = this.state || {};
const picked = st.picked || [];
const custom = st.custom || [];
const draft = st.draft || '';
const full = picked.length >= 3;
const base = 'min-height: 44px; padding: 0 16px; border-radius: 22px; font-family: inherit; font-size: 14px; ';
const toggle = (label) => {
if (picked.indexOf(label) >= 0) { this.setState({ picked: picked.filter((x) => x !== label) }); return; }
if (label === NONE) { this.setState({ picked: [NONE], adding: false }); return; }
const rest = picked.filter((x) => x !== NONE);
if (rest.length >= 3) return;
this.setState({ picked: rest.concat([label]) });
};
return {
count: picked.length,
canNext: picked.length >= 1,
cannotNext: picked.length < 1,
adding: !!st.adding,
draft: draft,
plusDisabled: full ? 'true' : 'false',
plusStyle: 'width: 44px; height: 44px; border-radius: 22px; display: flex; align-items: center; justify-content: center; ' + (full ? 'border: 1px dashed #e6e6e6; background: #ffffff; color: #8f8f8f; cursor: not-allowed' : 'border: 1px dashed #000000; background: #ffffff; color: #000000; cursor: pointer'),
openAdd: () => { if (!full) this.setState({ adding: true }); },
onDraft: (e) => this.setState({ draft: e.target.value }),
add: () => {
const t = draft.trim();
if (!t) return;
const rest = picked.filter((x) => x !== NONE);
if (rest.length >= 3) return;
const nextCustom = custom.indexOf(t) >= 0 || labels.indexOf(t) >= 0 ? custom : custom.concat([t]);
this.setState({ custom: nextCustom, picked: rest.indexOf(t) >= 0 ? rest : rest.concat([t]), adding: false, draft: '' });
},
keywords: labels.map((label) => {
const on = picked.indexOf(label) >= 0;
const off = !on && full;
return {
label: label,
pressed: on ? 'true' : 'false',
disabled: off ? 'true' : 'false',
style: base + (on ? 'border: 1px solid #000000; background: #000000; color: #ffffff; font-weight: 700; cursor: pointer' : (off ? 'border: 1px solid #e6e6e6; background: #ffffff; color: #8f8f8f; cursor: not-allowed' : 'border: 1px solid #d2d2d2; background: #ffffff; color: #000000; cursor: pointer')),
pick: () => toggle(label)
};
})
};
}
}
</script>
</body>
</html>
