<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>실천 1개 정하기</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#000000}a:hover{color:#444444}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #ffffff; color: #000000; font-family: 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
<header style="height: 56px; padding: 0 20px 0 4px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0">
<a href="Result2.dc.html" aria-label="결과로 돌아가기" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></a>
<span style="font-size: 14px; font-weight: 700">STEP 2 · 면담 스타일 점검</span>
<span style="width: 44px"></span>
</header>
<main style="flex: 1; padding: 28px 20px 24px; display: flex; flex-direction: column; gap: 24px; overflow: auto">
<div style="display: flex; flex-direction: column; gap: 12px">
<h1 style="margin: 0; font-size: 26px; line-height: 1.35; font-weight: 700; letter-spacing: -0.025em; word-break: keep-all"><strong style="display: inline-block; padding: 1px 8px; border-radius: 6px; background: #E3F3EA; color: #00703C; font-weight: 700">[별명]</strong>님과의 다음 면담에서<br>꼭 해야 하는 말 하나!</h1>
<p style="margin: 0; font-size: 16px; line-height: 1.6; color: #444444; word-break: keep-all">추천에서 고르거나, 내 말로 직접 써도 좋아요.</p>
</div>
<div role="radiogroup" aria-label="꼭 해야 하는 말 선택" style="display: flex; flex-direction: column; gap: 12px">
<sc-for list="{{ options }}" as="item" hint-placeholder-count="3">
<button type="button" role="radio" aria-checked="{{ item.checked }}" onClick="{{ item.pick }}" data-track="action_pick" data-value="{{ item.key }}" style="{{ item.style }}">
<span style="{{ item.dot }}"></span>
<span style="display: flex; flex-direction: column; gap: 6px; text-align: left"><span style="font-size: 12px; color: #676767">{{ item.sub }}</span><span style="font-size: 16px; line-height: 1.6; word-break: keep-all">{{ item.text }}</span></span>
</button>
</sc-for>
<div style="{{ customBox }}">
<button type="button" role="radio" aria-checked="{{ customChecked }}" onClick="{{ pickCustom }}" data-track="action_pick" data-value="custom" style="width: 100%; padding: 0; border: 0; background: transparent; font-family: inherit; color: #000000; cursor: pointer; display: flex; gap: 12px; align-items: center; text-align: left">
<span style="{{ customDot }}"></span>
<span style="display: flex; align-items: center; gap: 6px; font-size: 16px; font-weight: 700"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>직접 쓸게요</span>
</button>
<sc-if value="{{ isCustom }}" hint-placeholder-val="{{ false }}">
<label for="act-custom" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">꼭 해야 하는 말 직접 쓰기</label>
<textarea id="act-custom" data-track="action_custom_text" maxlength="100" rows="3" value="{{ draft }}" onChange="{{ onDraft }}" placeholder="[별명]님에게 처음 건넬 말을 내 말투로 적어 주세요" style="width: 100%; box-sizing: border-box; margin-top: 14px; padding: 12px 14px; border-radius: 8px; border: 1px solid #d2d2d2; font-family: inherit; font-size: 16px; line-height: 1.6; resize: none; color: #000000"></textarea>
<div style="margin-top: 6px; display: flex; justify-content: space-between; gap: 12px; font-size: 12px; line-height: 1.5; color: #676767"><span style="word-break: keep-all">적은 문장은 이름과 별명을 지운 뒤 프로그램 개선에만 써요.</span><span style="flex-shrink: 0">{{ draftLen }}/100</span></div>
</sc-if>
</div>
</div>
</main>
<div style="padding: 12px 20px 20px; border-top: 1px solid #e6e6e6; flex-shrink: 0">
<sc-if value="{{ canNext }}" hint-placeholder-val="{{ true }}">
<a href="Done.dc.html" data-track="action_confirmed" style="height: 48px; border-radius: 24px; background: #00B09B; color: #ffffff; text-decoration: none; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700">이걸로 할게요</a>
</sc-if>
<sc-if value="{{ cannotNext }}" hint-placeholder-val="{{ false }}">
<span aria-disabled="true" style="height: 48px; border-radius: 24px; background: #e6e6e6; color: #8f8f8f; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700">이걸로 할게요</span>
<p style="margin: 6px 0 0; text-align: center; font-size: 12px; color: #676767">꼭 해야 하는 말을 적어 주세요.</p>
</sc-if>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
// [결정 2026-11-25 · 다음 버튼 색] 하단 주 버튼('다음', '결과 보기', '꼭 해야 하는 말 정하기', '완료' 등)은 단색 #00B09B + 흰 굵은 글씨(그라데이션 없음). 막힌 상태는 회색(#e6e6e6 배경, #8f8f8f 글자)으로 구분. 진행 막대·선택된 답 칩은 검정 유지
// 첫 번째는 결과 3(다음에 해 볼 것)과 같은 추천 문장, 나머지 2개는 고르지 않은 상황 중 우선순위가 높은 문장(시안은 예시)
const presets = [
{ key: 'recommended', sub: '결과에서 추천한 말', text: '“지난 면담에서 제가 충분히 듣지 못한 것 같아 마음에 걸렸어요. 아쉬웠던 부분을 이번엔 끝까지 들어 볼게요.”' },
{ key: 'tears', sub: '울거나 말이 없어졌던 구성원과 다시 마주할 때', text: '“지난번 면담 이후로 마음이 좀 어땠어요? 그때 다 못 한 이야기가 있으면 편할 때 들려줘요.”' },
{ key: 'lowgrade', sub: '낮은 등급을 전한 뒤, 다시 마주 앉을 때', text: '“지난번 결과 이야기 이후로 마음이 어땠는지 궁금했어요. 그때 다 못 한 이야기가 있으면 먼저 듣고 싶어요.”' }
];
const sel = (this.state && this.state.sel) || 'recommended';
const draft = (this.state && this.state.draft) || '';
const isCustom = sel === 'custom';
const ready = !isCustom || draft.trim().length > 0;
const card = (on) => 'width: 100%; display: flex; gap: 12px; align-items: flex-start; padding: 18px; border-radius: 24px; background: #ffffff; color: #000000; font-family: inherit; cursor: pointer; ' + (on ? 'border: 2px solid #000000' : 'border: 1px solid #d2d2d2; margin: 1px 0');
const dot = (on) => 'flex-shrink: 0; width: 20px; height: 20px; margin-top: 3px; box-sizing: border-box; border-radius: 50%; ' + (on ? 'border: 6px solid #000000' : 'border: 2px solid #d2d2d2');
return {
options: presets.map((p) => ({
key: p.key, sub: p.sub, text: p.text,
checked: sel === p.key ? 'true' : 'false',
style: card(sel === p.key),
dot: dot(sel === p.key),
pick: () => this.setState({ sel: p.key })
})),
customChecked: isCustom ? 'true' : 'false',
customBox: card(isCustom).replace('align-items: flex-start; ', '').replace('display: flex; gap: 12px; ', 'display: block; ').replace('cursor: pointer; ', ''),
customDot: dot(isCustom).replace('margin-top: 3px; ', ''),
pickCustom: () => this.setState({ sel: 'custom' }),
isCustom: isCustom,
draft: draft,
draftLen: draft.length,
onDraft: (e) => this.setState({ draft: e.target.value }),
canNext: ready,
cannotNext: !ready
};
}
}
</script>
</body>
</html>
