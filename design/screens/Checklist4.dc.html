<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>면담 스타일 점검하기 4</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#000000}a:hover{color:#444444}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #ffffff; color: #000000; font-family: 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
<header style="height: 56px; padding: 0 20px 0 4px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0">
<a href="Checklist3.dc.html" aria-label="이전 화면" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></a>
<span style="font-size: 14px; font-weight: 700">STEP 2 · 면담 스타일 점검</span>
<span style="font-size: 12px; color: #676767">체크 4/5</span>
</header>
<div role="progressbar" aria-label="체크 진행" aria-valuemin="0" aria-valuemax="5" aria-valuenow="4" style="height: 4px; background: #e6e6e6; flex-shrink: 0"><div style="width: 80%; height: 4px; background: #000000"></div></div>
<main style="flex: 1; padding: 24px 20px 20px; display: flex; flex-direction: column; gap: 24px; overflow: auto">
<div style="display: flex; flex-direction: column; gap: 8px">
<p style="margin: 0; font-size: 13px; font-weight: 700; color: #676767">공정한 평가</p>
<h1 style="margin: 0; font-size: 26px; line-height: 1.35; font-weight: 700; letter-spacing: -0.025em; word-break: keep-all"><strong style="display: inline-block; padding: 1px 8px; border-radius: 6px; background: #E3F3EA; color: #00703C; font-weight: 700">[별명]</strong>님과<br>평가를 어떻게 이야기했나요?</h1>

</div>
<div style="display: flex; flex-direction: column; gap: 10px">
<sc-for list="{{ items }}" as="it" hint-placeholder-count="3">
<div style="padding: 14px 16px; border-radius: 24px; background: #f7f7f7; display: flex; flex-direction: column; gap: 8px">
<p style="margin: 0; font-size: 16px; line-height: 1.45; word-break: keep-all">{{ it.text }}</p>
<div role="group" aria-label="{{ it.text }}" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px">
<sc-for list="{{ it.options }}" as="op" hint-placeholder-count="2">
<button type="button" onClick="{{ op.pick }}" aria-pressed="{{ op.pressed }}" style="{{ op.style }}">{{ op.label }}</button>
</sc-for>
</div>
</div>
</sc-for>
</div>
</main>
<div style="padding: 12px 20px 20px; border-top: 1px solid #e6e6e6; display: flex; flex-direction: column; gap: 4px; flex-shrink: 0">
<sc-if value="{{ allDone }}" hint-placeholder-val="{{ true }}">
<a href="Checklist5.dc.html" style="height: 48px; border-radius: 24px; background: #00B09B; color: #ffffff; text-decoration: none; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700">다음</a>
</sc-if>
<sc-if value="{{ notDone }}" hint-placeholder-val="{{ false }}">
<span aria-disabled="true" style="height: 48px; border-radius: 24px; background: #e6e6e6; color: #8f8f8f; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700">다음</span>
<p style="margin: 6px 0 0; text-align: center; font-size: 12px; color: #676767">이 페이지의 문항에 모두 답해 주세요.</p>
</sc-if>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
// [결정 2026-11-25 · 다음 버튼 색] 하단 주 버튼('다음', '결과 보기', '꼭 해야 하는 말 정하기', '완료' 등)은 단색 #00B09B + 흰 굵은 글씨(그라데이션 없음). 막힌 상태는 회색(#e6e6e6 배경, #8f8f8f 글자)으로 구분. 진행 막대·선택된 답 칩은 검정 유지
const opts = ['했어요', '못 했어요'];
// [결정 2026-11-25] 해당 없음 보조 선택지('이번 면담에서 등급을 전하지 않았어요', '구성원이 의견을 내지 않았어요')는 없앴다. 세 문항 모두 '했어요/못 했어요' 중 하나로만 답한다
const texts = ["등급과 함께 목표 대비 근거를 보여 줬다", "구성원 의견에 답하며 충분히 이야기했다", "최근 일만이 아니라 1년 기록을 근거로 삼았다"];
const ans = (this.state && this.state.ans) || {};
const base = 'min-height: 44px; padding: 0 4px; border-radius: 22px; font-family: inherit; font-size: 14px; cursor: pointer; ';
const done = texts.every((t, i) => !!ans[i]);
return {
allDone: done,
notDone: !done,
items: texts.map((text, ii) => ({
text: text,
options: opts.map((label) => {
const sel = ans[ii] === label;
return {
label: label,
pressed: sel ? 'true' : 'false',
style: base + (sel ? 'border: 1px solid #000000; background: #000000; color: #ffffff; font-weight: 700' : 'border: 1px solid #d2d2d2; background: #ffffff; color: #000000'),
pick: () => { const next = Object.assign({}, ans); next[ii] = label; this.setState({ ans: next }); }
};
})
}))
};
}
}
</script>
</body>
</html>
