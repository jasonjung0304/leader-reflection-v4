// [결정 2026-11-25] 시범 운영은 기업문화팀 내부만. 내부 인원은 교육 내용에 익숙해 소요 시간이 짧게 나올 수 있으므로, 본 운영 첫 주 실측값으로 '약 [n]분'을 다시 확인
// [결정 2026-11-25 · 개발 방향 변경] Vercel 배포, 로그인 없음, 개인정보(이름·사번·이메일·소속) 미수집. 다음 화면에서 리더명을 정한다
