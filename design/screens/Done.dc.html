class Component extends DCLogic {
renderVals() {
// [결정 2026-11-25 · 배경] 안내·퀵 리뷰 시작·완료 세 화면은 Great Candor 포스터 배경과 같은 그라데이션: 오른쪽 위 #96C93E → 왼쪽 아래 #00B09B (CSS linear-gradient(to bottom left, #96C93E, #00B09B)). 글자·화살표·뒤로 가기 아이콘은 흰색(#ffffff). 하단 '다음' 버튼만 단색 #00B09B
// 화면 폭 규칙의 예외: 이 화면들은 바깥 여백까지 브라우저 전체에 그라데이션을 칠한다. 모바일 상태 표시줄 색(meta theme-color)은 #96C93E
// 리더명 토큰은 흰 배경 + 검정 굵은 글씨, 별명 토큰은 그대로(연녹색 배경·녹색 글자). 흰 카드·버튼 안 글자는 검정 유지
// 명도 대비 주의: 흰 글자와 밝은 연두(#96C93E)는 대비가 낮다(WCAG AA 미달). 본문은 굵기 400 이상·16px 이상을 유지하고 13px 이하 글자는 굵게(700) 쓴다
// [결정 2026-11-25 · 이름 부르기] 제목은 '[리더명]님, 수고하셨어요'. 리더명 화면에서 고르거나 직접 쓴 이름을 그대로 넣고 회색 리더명 토큰(#f0f0f0 배경, 검정 굵게)으로 표시. 직접 쓴 이름이 '리더'로 끝나지 않으면 뒤에 ' 리더'를 붙여 부른다(예: 묻고 듣는 → 묻고 듣는 리더님). 이 규칙은 리더명을 부르는 모든 화면(퀵 리뷰 시작, 결과 1)에 공통
// [결정 2026-11-25 · 단순화] 3칸 버튼은 상자(흰 배경)를 없애고 흰 아이콘(28px) + 흰 굵은 글씨만 둔다. 누를 수 있는 영역은 칸 전체(높이 88px) 유지. 눌렀을 때·키보드 포커스 시 흰색 12% 배경으로 반응
// [결정 2026-11-25] 완료 화면 버튼은 한 줄 3칸(같은 크기, 한 번 누르면 바로 실행), 왼쪽부터 '다른 구성원 점검하기' / '나에게 결과 보내기' / '동료에게 추천하기'. 이름은 두 줄로 고정 표시
// [개발 명세 · 다른 구성원 점검하기] 다른 구성원으로 새 점검을 시작(구성원 떠올리기로 이동, 별명·상황은 비운 상태). 횟수 제한 없음. 기록 another_member_started
// [개발 명세 · 동료에게 추천하기] 결과는 보내지 않고 링크만 보낸다(이름에 '결과'를 넣지 않은 이유). 다른 팀장에게 이 리플렉션 링크를 보낸다. navigator.share({ title, text, url }) — 파일 없이 링크만. url = 운영 주소 + 입장 키 + ref=recommend
//   보낼 문장(content.json → done.recommend_text): 'GC Review 면담을 돌아보는 팀장 리더십 리플렉션이에요. 약 {n}분이면 끝나요.' 리더명·별명·결과는 넣지 않는다
//   공유 창 미지원(주로 PC): 링크를 클립보드에 복사하고 '링크를 복사했어요' 알림(2초)
//   기록: recommend_opened / recommend_shared(성공) / recommend_cancelled(AbortError) / recommend_copied. ref=recommend 로 들어온 첫 방문은 visit_from_recommend(기기 ID)로 기록
//   주의: 링크에 입장 키가 들어 있으므로 받은 사람이 다시 전달하면 대상 밖으로 퍼질 수 있다. 문제가 생기면 설정에서 입장 키를 바꾼다
// [개발 명세] 완료 화면에 '결과 다시 보기'는 두지 않는다. 결과 확인은 상단 뒤로 가기(실천 → 결과 3 → 2 → 1)와 PDF로. 지난 점검 기록은 두지 않는다
// [개발 명세 · 나에게 결과 보내기] 버튼을 누르면 결과 PDF를 만들어 기기 기본 공유 창(Web Share API, navigator.share + files)에 띄운다. 리더가 카카오톡 나와의 채팅·Teams·메일·파일 앱 중 선택
